<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;height:100%}</style>
<meta name="author" content="Zarif Zainol, RPh 25633, Pegawai Farmasi, Hospital Kepala Batas">
<title>Kaunter Demam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed 1280x720 pixel-art stage scaled to fit — sunlit waiting hall on top, two patients at the counter, RPG-style medicine inventory in the counter front, docked panels at the bottom so prescriptions stay visible */
:root{
  --royal:#1769b0;
  --sky:#4aa3df;
  --orange:#f2752e;
  --yellow:#e8b830;
  --green:#3fae6a;
  --mint:#bcebd9;
  --teal:#168f83;
  --teal-deep:#0f6a61;
  --cream:#fff0cf;
  --ink:#2a1f22;
  --red:#e2474f;
  --font:"Pixelify Sans","Courier New",monospace;
  --font-logo:"Bungee","Impact",sans-serif;
  --font-num:"Bungee","Arial Black",sans-serif;
  --font-read:"Atkinson Hyperlegible","Verdana",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#2b86cf 0%,#1769b0 45%,#0c3a66 100%);color:var(--ink);font-family:var(--font);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #ffe15a;outline-offset:2px}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.outer{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.rotate{color:#fff;font-weight:700;font-size:15px;text-align:center;margin-bottom:8px;display:none}
@media (orientation:portrait){.rotate{display:block}}
#viewport{position:relative;max-width:100%;overflow:hidden;box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--cream),0 0 0 12px var(--ink),8px 10px 0 12px rgba(0,0,0,.3)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none}
.abs{position:absolute}
#scene{left:0;top:0;width:1280px;height:440px}
#counter{left:0;top:428px;width:1280px;height:292px}

/* ---------- pixel panels & arcade buttons ---------- */
.pb{background:linear-gradient(#fffaf0 0%,#fff0cf 55%,#f3dcae 100%);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(160,100,30,.18),inset 4px 4px 0 rgba(255,255,255,.8),4px 4px 0 rgba(0,0,0,.3)}
.pbtn{border:4px solid var(--ink);padding:6px 18px;font-weight:700;font-size:22px;color:var(--ink);background:linear-gradient(#ffffff 0%,#fff6e2 50%,#ecd9b4 100%);box-shadow:inset -4px -4px 0 rgba(0,0,0,.16),inset 4px 4px 0 rgba(255,255,255,.6),4px 4px 0 rgba(0,0,0,.3);transition:transform .08s steps(2),filter .08s}
.pbtn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07)}
.pbtn:active:not(:disabled){transform:translate(3px,3px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.16),1px 1px 0 rgba(0,0,0,.3)}
.pbtn.g{background:linear-gradient(#8ae6a4 0%,#3fae6a 55%,#2a8a50 100%);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.pbtn.o{background:linear-gradient(#ffad74 0%,#f2752e 55%,#cf5615 100%);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.pbtn.b{background:linear-gradient(#8dcdf4 0%,#4aa3df 50%,#1769b0 100%);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.pbtn:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.slotbox{display:grid;place-items:center;border:3px solid var(--ink);background:radial-gradient(circle at 50% 58%,rgba(255,255,255,.38) 0 28%,rgba(255,255,255,0) 62%),linear-gradient(#41598a,#222d48);box-shadow:inset 3px 3px 0 rgba(255,255,255,.22),inset -3px -3px 0 rgba(0,0,0,.3)}
.slotbox img{display:block}

/* ---------- HUD ---------- */
.hud{left:0;top:0;width:1280px;height:76px;display:flex;align-items:flex-start;justify-content:space-between;padding:12px 16px;pointer-events:none;z-index:6}
.hud > *{pointer-events:auto}
.hbox{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 8px;height:54px}
.hbox img{width:38px;height:38px}
.hbox .lb{font-size:12px;font-weight:700;line-height:1;color:#a5651c;text-transform:uppercase;letter-spacing:1px;display:block}
.hbox b{display:block;font-family:var(--font-num);font-weight:400;font-size:22px;letter-spacing:1px;line-height:1.05;font-variant-numeric:tabular-nums}
.mid{display:flex;align-items:center;gap:14px;padding:4px 16px;height:54px;background:linear-gradient(#ffb57a 0%,#f2752e 55%,#cf5615 100%)}
.mid .seg{display:flex;align-items:center;gap:6px}
.mid .seg b{font-family:var(--font-num);font-weight:400;font-size:22px;line-height:1;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.mid .seg img{width:34px;height:34px}
.bar{height:24px;border:3px solid var(--ink);background:linear-gradient(#2e2420,#5b4a43);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#a8f096,#3fae6a 60%,#2a8a50);transition:width .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 4px 0 rgba(255,255,255,.3)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--font-num);font-size:14px;letter-spacing:1px;text-shadow:2px 2px 0 var(--ink)}
.bar.k i{background:linear-gradient(#ffa08a,#e2474f 60%,#b8303a)}
.right{display:flex;gap:10px}
.timer b{min-width:68px}
.timer.low{animation:tpulse .5s steps(2) infinite}
.timer.low b{color:var(--red)}
@keyframes tpulse{50%{transform:scale(1.08);background:linear-gradient(#ffe2e2,#ffb3b3)}}
.pause{width:54px;height:54px;padding:0;display:grid;place-items:center;background:linear-gradient(#ffad74,#f2752e 55%,#cf5615)}
.pause img{width:28px;height:28px}

/* ---------- Patients ---------- */
.bob{position:absolute;inset:0;animation:idle 1.4s steps(2) infinite}
@keyframes idle{50%{transform:translateY(3px)}}
img.blk{opacity:0;animation:blinkE 4.4s steps(1) infinite}
@keyframes blinkE{0%,92%{opacity:0}93%,96%{opacity:1}97%,100%{opacity:0}}
.slot{top:96px;width:220px;height:340px;cursor:pointer}
.slot .pt{position:absolute;left:14px;bottom:0;width:192px;height:264px;transform-origin:50% 100%;transition:transform .45s steps(6),opacity .3s}
.slot .pt img{position:absolute;left:0;top:0;width:192px;height:264px;display:block}
.slot.empty .pt{opacity:0;transform:translateY(80px)}
.slot .pt.kid{transform:scale(.8)}
.slot .pt.leave-happy{animation:hop .9s steps(9) forwards}
.slot .pt.leave-angry{animation:stomp .9s steps(9) forwards}
@keyframes hop{20%{transform:translateY(-34px)}40%{transform:translateY(0)}55%{transform:translateY(-16px)}100%{transform:translate(-90px,60px);opacity:0}}
@keyframes stomp{0%,30%{transform:translateX(0)}10%,20%{transform:translateX(-8px)}15%,25%{transform:translateX(8px)}100%{transform:translate(90px,60px);opacity:0}}
.slot .pt.fume .bob{animation:shake .14s steps(2) infinite}
@keyframes shake{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.slot .pt.fume img{animation:fumeglow .5s steps(2) infinite}
.slot .pt.fume img.blk{animation:blinkE 4.4s steps(1) infinite}
@keyframes fumeglow{0%{filter:drop-shadow(0 0 0 #ff3b3b) drop-shadow(0 0 16px rgba(255,40,40,.95))}50%{filter:drop-shadow(0 0 0 #ff3b3b) drop-shadow(0 0 5px rgba(255,40,40,.45))}}
.slot .pt.flush img{filter:drop-shadow(0 0 9px rgba(255,100,80,.65))}
.steam{position:absolute;top:4px;width:24px;height:24px;background:linear-gradient(#ffffff,#d9dde0);border:4px solid var(--ink);opacity:0;animation:steam 1.1s steps(6) infinite;pointer-events:none}
.steam.s1{left:18px}.steam.s2{left:150px;animation-delay:.55s}
@keyframes steam{0%{transform:translateY(10px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-46px) scale(1.15);opacity:0}}
.hbar{position:absolute;left:48px;top:-28px;width:108px;height:22px;border:3px solid var(--ink);background:linear-gradient(#2e2420,#5b4a43);box-shadow:3px 3px 0 rgba(0,0,0,.3);padding:2px 2px 2px 20px}
.slot .pt .hbar img{position:absolute;left:-10px;top:-5px;width:26px;height:24px;filter:none;animation:none}
.hbar i{display:block;height:100%;width:100%;background:linear-gradient(#a8f096,#3fae6a 60%,#2a8a50);transition:width .3s steps(4)}
.hbar.warn i{background:linear-gradient(#fff0a0,#e8b830 60%,#c08f12)}
.hbar.crit i{background:linear-gradient(#ffa08a,#e2474f 60%,#b8303a);animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:.45}}
.slot.active::after{content:"";position:absolute;left:94px;top:14px;width:0;height:0;border:16px solid transparent;border-top:20px solid #ffe15a;filter:drop-shadow(0 4px 0 var(--ink));animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(6px)}}

.say{top:62px;width:250px;padding:6px 8px 8px;font-size:15px;line-height:1.15;font-weight:600;z-index:5;background:linear-gradient(#ffffff,#eef3f8)}
.say::after{content:"";position:absolute;left:124px;bottom:-16px;border:8px solid transparent;border-top:8px solid var(--ink)}
.say.hide{display:none}
.say .pbtn{margin-top:5px;padding:2px 10px;font-size:16px;width:100%}
.say.angry{background:linear-gradient(#fff0f0,#ffc9cc)}

/* ---------- RPG prescription card ---------- */
.bubble{top:84px;width:300px;cursor:pointer;display:flex}
.bubble.hide{display:none}
.rxcard{flex:1;padding:0;position:relative;background:linear-gradient(#fffaf0,#fff0cf 70%,#f5e0b4)}
.rxcard::before{content:"";position:absolute;left:-16px;top:84px;border:6px solid transparent;border-right:8px solid var(--ink)}
.bubble.active .rxcard{outline:4px solid #ffe15a;outline-offset:2px}
.rxtop{display:flex;gap:8px;align-items:center;padding:6px 8px;background:linear-gradient(#36bfb0,#168f83 60%,#0f6a61);border-bottom:4px solid var(--ink);color:#fff}
.rxbadge{flex:none;width:38px;height:38px;display:grid;place-items:center;background:linear-gradient(#ffad74,#f2752e 55%,#cf5615);border:3px solid var(--ink);font-family:Georgia,serif;font-size:24px;font-weight:700;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3);box-shadow:inset 2px 2px 0 rgba(255,255,255,.45)}
.rxwho{min-width:0;line-height:1.1}
.rxwho b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.rxwho span{font-family:var(--font-read);font-size:13px;font-weight:700;color:#dffcf6}
.rxbody{padding:4px 8px 6px}
.rxl{display:grid;grid-template-columns:38px 1fr;gap:6px;align-items:center;padding:4px 2px;border-bottom:2px dashed rgba(42,31,34,.18)}
.rxl:last-child{border-bottom:0}
.rxl.tap:hover{background:rgba(74,163,223,.16)}
.rxl .slotbox{width:38px;height:38px;border-width:2px}
.rxl .slotbox img{width:30px;height:30px}
.rxl .d{color:#1a3a8c;line-height:1.15;min-width:0;font-family:var(--font-read)}
.rxl .d b{font-size:15px;display:block;font-weight:700}
.rxl .d span{font-size:14px}
.rxl .q{display:inline-block;font-family:var(--font-num);font-weight:400;font-size:12px;letter-spacing:1px;background:linear-gradient(#ffe6c2,#ffc58a);color:#a3430b;padding:1px 6px;margin-left:4px;border:2px solid #a3430b}
.rxl .q.unk{background:linear-gradient(#e6f4ff,#bcdcf6);color:var(--royal);border-color:var(--royal)}
.pbar{display:none}

/* ---------- Baskets ---------- */
.basket{top:440px;width:540px;height:68px;display:flex;align-items:center;gap:8px;padding:4px 8px 4px 10px;cursor:pointer}
.basket.hide{display:none}
.basket.active{outline:4px solid #ffe15a;outline-offset:2px}
.basket .lab{font-size:12px;font-weight:700;color:#a5651c;line-height:1;width:66px;flex:none;text-transform:uppercase;letter-spacing:1px}
.basket .lab b{display:block;color:var(--ink);font-size:17px;text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.basket .its{flex:1;display:flex;gap:10px;min-width:0;overflow:hidden;align-items:center;padding-top:6px}
.basket .its em{font-style:normal;font-size:15px;color:#9a7c5a}
.bi{position:relative;width:46px;height:46px;flex:none;padding:0}
.bi img{width:34px;height:34px}
.bi b{position:absolute;right:-9px;top:-11px;background:linear-gradient(#ffad74,#e0601e);color:#fff;border:3px solid var(--ink);font-family:var(--font-num);font-weight:400;font-size:13px;min-width:26px;height:24px;line-height:18px;padding:0 3px;text-align:center}
.serve{flex:none;font-size:20px;padding:6px 14px}

/* ---------- RPG inventory ---------- */
.med{width:196px;height:88px;padding:4px 6px;display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center;text-align:left;background:linear-gradient(#fffaf0,#fff0cf 60%,#f1dcae);border:4px solid var(--ink);box-shadow:inset 0 6px 0 var(--mc),inset -3px -3px 0 rgba(160,100,30,.2),4px 4px 0 rgba(0,0,0,.32);transition:transform .1s steps(2)}
.med .slotbox{width:60px;height:60px}
.med .slotbox img{width:48px;height:48px}
.med:hover{transform:translateY(-4px);box-shadow:inset 0 6px 0 var(--mc),inset -3px -3px 0 rgba(160,100,30,.2),4px 8px 0 rgba(0,0,0,.3),0 0 0 3px #ffe15a}
.med:active{transform:translate(2px,2px)}
.med.sel{transform:translateY(-4px);animation:selglow .6s steps(2) infinite}
@keyframes selglow{0%{box-shadow:inset 0 6px 0 var(--mc),4px 8px 0 rgba(0,0,0,.3),0 0 0 4px #ffe15a,0 0 18px 8px rgba(255,225,90,.9)}50%{box-shadow:inset 0 6px 0 var(--mc),4px 8px 0 rgba(0,0,0,.3),0 0 0 4px #fff6b0,0 0 6px 2px rgba(255,225,90,.5)}}
.med .nm{font-size:15px;font-weight:700;line-height:1.05;display:block;letter-spacing:-.3px;margin-top:4px}
.med .st{font-family:var(--font-read);font-size:13px;color:#6b5d55;line-height:1.15;display:block}
.med .st i{font-style:normal;color:var(--teal-deep);font-weight:700}
.med.glow{animation:glow .5s steps(1) 4}
@keyframes glow{50%{background:#ffe15a}}

/* ---------- Dock panels (quantity / comfort) ---------- */
.dock{left:24px;top:524px;width:1232px;height:188px;z-index:18;display:flex;align-items:center;gap:22px;padding:12px 22px}
.dock .tag{position:absolute;left:18px;top:-36px;background:linear-gradient(#ffad74,#f2752e 55%,#cf5615);color:#fff;font-weight:700;font-size:18px;padding:2px 12px;border:4px solid var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.dock .item{display:flex;align-items:center;gap:14px;width:340px;flex:none}
.dock .item .slotbox{width:124px;height:124px;flex:none}
.dock .item .slotbox img{width:104px;height:104px}
.dock .item h3{margin:0;font-size:28px;line-height:1}
.dock .item p{margin:4px 0 0;font-family:var(--font-read);font-size:16px;color:#6b5d55;line-height:1.2}
.qty{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1}
.qrow{display:flex;align-items:center;gap:12px}
.qb{width:60px;height:60px;padding:0;font-size:34px;line-height:1}
.num{min-width:120px;text-align:center;font-family:var(--font-num);font-size:52px;line-height:.9;color:#c2470b;text-shadow:3px 3px 0 #f7c9a0;font-variant-numeric:tabular-nums}
.num small{display:block;font-family:var(--font);text-shadow:none;font-size:16px;color:#6b5d55}
.quick{display:flex;gap:8px}
.quick .pbtn{font-family:var(--font-num);font-weight:400;font-size:15px;padding:2px 12px}
.acts{display:flex;flex-direction:column;gap:10px;width:220px;flex:none}
.acts .pbtn{width:100%}
.talk{flex:none;display:flex;align-items:center;gap:12px;width:340px}
.talk img{width:96px;height:132px;flex:none}
.talk .line{background:linear-gradient(#ffffff,#eef3f8);border:4px solid var(--ink);padding:8px 10px;font-size:17px;font-weight:600;line-height:1.2}
.opts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opts .pbtn{font-size:16px;line-height:1.2;text-align:left;padding:8px 10px;font-weight:600;min-height:110px}
.dock .x{position:absolute;right:-4px;top:-40px;padding:0 10px;font-size:18px}

/* ---------- Effects ---------- */
.float{font-family:var(--font-num);font-size:34px;color:#fff;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),4px 4px 0 var(--ink);animation:rise 1.3s steps(12) forwards;pointer-events:none;z-index:15}
.float.bad{color:#ff9aa0}
.float.love{color:#ff7fb0}
@keyframes rise{0%{transform:translateY(10px);opacity:0}15%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
.spark{width:18px;height:18px;z-index:15;pointer-events:none;background:var(--c,#ffe15a);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .85s steps(8) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:1}35%{transform:translate(calc(var(--dx) * .55),calc(var(--dy) * .55)) scale(1.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#flash{left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:13;background:rgba(226,71,79,.38);opacity:0}
#flash.on{animation:flash .5s steps(4)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#danger{left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:12;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 0 10px rgba(226,71,79,.55),inset 0 0 90px 20px rgba(226,71,79,.45)}
#danger.on{opacity:1;animation:dpulse .8s steps(2) infinite}
@keyframes dpulse{50%{opacity:.45}}
.toast{left:50%;top:384px;transform:translateX(-50%);background:linear-gradient(#fffaf0,#fff0cf);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.3);font-weight:700;font-size:18px;padding:6px 16px;z-index:16;pointer-events:none;animation:fade 2.2s forwards;white-space:nowrap}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}

/* ---------- Overlays ---------- */
.ov{left:0;top:0;width:1280px;height:720px;background:rgba(12,40,70,.6);display:flex;align-items:center;justify-content:center;z-index:20}
.panel{padding:20px 24px;position:relative;max-height:680px;overflow:auto}
.ribbon{position:absolute;left:50%;top:-4px;transform:translate(-50%,-60%);white-space:nowrap;background:linear-gradient(#ffad74,#f2752e 55%,#cf5615);color:#fff;font-size:26px;font-weight:700;padding:2px 28px;border:4px solid var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.25);box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.ribbon.red{background:linear-gradient(#ff9a9f,#e2474f 55%,#b8303a)}
.ribbon.green{background:linear-gradient(#8ae6a4,#3fae6a 55%,#2a8a50)}
.panel.fb,.panel.end,.panel.pz,.panel.credits{overflow:visible}

/* ---------- Title screen ---------- */
.start{display:block;background:none;padding:0}
.start #menubg{position:absolute;left:0;top:0;width:1280px;height:720px}
.mtitle{position:absolute;left:0;top:30px;width:1280px;text-align:center;z-index:3}
.logo{display:flex;gap:4px;justify-content:center;font-family:var(--font-logo);font-size:92px;line-height:1}
.logo span{color:var(--c);display:inline-block;animation:lbounce 3s steps(2) infinite;text-shadow:4px 4px 0 var(--d),6px 6px 0 var(--d),-5px -5px 0 #fff,5px -5px 0 #fff,-5px 5px 0 #fff,0 -6px 0 #fff,-6px 0 0 #fff,6px 0 0 #fff,0 6px 0 #fff,10px 10px 0 #fff,10px 6px 0 #fff,6px 10px 0 #fff,10px 12px 0 var(--ink),14px 14px 0 rgba(0,0,0,.25)}
@keyframes lbounce{0%,84%{transform:none}90%{transform:translateY(-8px)}}
.logo .sp{width:34px}
.subt{text-align:center;margin-top:18px}
.subt span{display:inline-block;background:linear-gradient(#fffaf0,#fff0cf);border:4px solid var(--ink);padding:4px 18px;font-weight:700;font-size:20px;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.deco{position:absolute;z-index:2;animation:floaty 2.2s steps(2) infinite;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.2))}
.deco img{width:100%;height:100%;display:block;transform:rotate(var(--r,0deg))}
@keyframes floaty{50%{transform:translateY(-10px)}}
.mchar{position:absolute;width:128px;height:176px;transform-origin:50% 100%}
.mchar img{position:absolute;left:0;top:0;width:128px;height:176px}

function paint(W,H,fn,outline='#2a1f22'){
  let g=[...Array(H)].map(()=>Array(W).fill(null));

  for(let y=0;y<H;y++)for(let i=0;i<W;i++)if(g[y][i]){x.fillStyle=g[y][i];x.fillRect(i,y,1,1)}
  return c.toDataURL();

function makeLook(gender,group,kid,age){
  const L={key:'L'+(++uid),skin:pick(SKIN[group]),hair:age>55?pick(['#d6d6d6','#bdbdbd']):pick(['#1f1a1c','#2e2220','#3a2a22','#22201f']),
    shirt:pick(['#4aa3df','#e2474f','#3fae6a','#e8b830','#8a63c4','#23907f','#f08ab0','#f2752e']),
    hijab:pick(['#e66a8f','#5b8fd6','#8a63c4','#34a79a','#f0a33a','#c94f4f','#f4ead2','#9fb7d6']),
    jacket:pick(['#2f3446','#3b4a6b','#5a4a3a','#3d4a3d']),tie:pick(['#c8343c','#2f56a6','#e8b830']),sampin:pick(['#7a3d6b','#2f56a6','#8a2f37']),
    mask:!kid&&Math.random()<0.3,glasses:age>48?Math.random()<0.8:Math.random()<0.15,patch:kid&&Math.random()<0.7};
  if(gender==='h'){L.style='hijab';L.outfit=pick(['kurung','kurung','kemeja','tshirt'])}
  else if(gender==='f'){L.style=kid?pick(['pony','long']):pick(age>55?['bun']:['long','bun','pony']);L.outfit=pick(['tshirt','kemeja','kurung'])}
  else{
    if(kid){L.style=pick(['short','spiky']);L.outfit='tshirt'}
    else if(group==='ml'){L.style=age>55?pick(['kopiah','songkok','old']):pick(['short','part','songkok','kopiah']);L.outfit=pick(['tshirt','kemeja','melayu','blazer'])}
    else{L.style=age>55?'old':pick(['short','part','spiky']);L.outfit=pick(['tshirt','kemeja','blazer'])}
  }
  if(L.style==='songkok'||L.style==='kopiah')L.outfit=pick(['melayu','melayu','kemeja','blazer']);
  return L;
}

function makePatient(mode){
  const M=MODES[mode];
  const child=Math.random()<0.4;
  const n=rnd(M.lines[0],M.lines[1]);
  let lines=[],age,weight,nm;
  if(child){
    age=rnd(2,11);weight=Math.round(age*2.2+8+rnd(-2,2));nm=pick(KIDS);
    const small=age<6;
    lines.push(L_syr('pcm_s',small?5:10,4,3));
    const g=shuffle([()=>L_syr('cpm_s',small?2.5:5,3,5),()=>L_syr('brm_s',small?2.5:5,3,5),()=>L_syr('amx_s',small?5:10,3,5),()=>L_ors()]);
    for(let i=0;i<n-1;i++)lines.push(g[i]());
  }else{
    age=rnd(18,72);weight=rnd(48,90);nm=pick(ADULTS);
    lines.push(L_tab('pcm_t',pick([1,2]),4,3));
    const g=shuffle([()=>L_tab('cpm_t',1,3,pick([3,5])),()=>L_tab('brm_t',1,3,5),()=>L_tab('amx_c',2,3,pick([5,7])),
      ()=>pick([L_thy,L_ors,L_sal,()=>L_tab('vtc',1,pick([1,2]),pick([5,7]))])()]);
    for(let i=0;i<n-1;i++)lines.push(g[i]());
  }
  const look=makeLook(nm[1],nm[2],child,age);
  const hon=child?'adik':nm[1]==='m'?'encik':'puan';
  return{id:++uid,name:nm[0],age,weight,child,lines,look,hon};
}
function drugText(l,mode){
  const m=MEDS[l.id];
  if(MODES[mode].abbr){
    if(l.kind==='fixed')return `${PREFIX[m.form]?PREFIX[m.form]+' ':''}${m.name}`;
    if(l.kind==='syr')return `Syr. ${m.ab} ${m.str}`;
    return `${PREFIX[m.form]} ${m.ab}`;
  }
  return (m.form==='gargle'||m.form==='sachet'||m.form==='inh')?`${m.name} ${FORM[m.form]}`:`${m.name} ${m.str} ${FORM[m.form]}`;
}
function dirText(l,mode){
  const M=MODES[mode],m=MEDS[l.id];
  if(l.kind==='fixed')return M.abbr?l.pro:l.easy;
  if(M.abbr){
    if(l.kind==='tab')return `${fmtMg(l.perDose*m.mg)} ${FREQ_AB[l.freq]} × ${l.days}/7`;
    return `${fmtMg(l.ml*m.mgPer5/5)} ${FREQ_AB[l.freq]} × ${l.days}/7`;
  }
  if(l.kind==='tab')return `${l.perDose} biji, ${FREQ_BM[l.freq]}, ${l.days} hari`;
  return `${num(l.ml)}ml, ${FREQ_BM[l.freq]}, ${l.days} hari`;
}
function calcText(l,mode){
  const M=MODES[mode],m=MEDS[l.id];
  if(l.kind==='fixed')return l.calc;
  let pre='';
  if(l.kind==='tab'){
    if(M.abbr)pre=`${fmtMg(l.perDose*m.mg)} ÷ ${m.str} = ${l.perDose} biji. `;
    return pre+`${l.perDose} biji × ${l.freq} kali × ${l.days} hari = ${l.qty} biji`;
  }
  if(M.abbr)pre=`${fmtMg(l.ml*m.mgPer5/5)} ÷ (${m.mgPer5}mg/5ml) = ${num(l.ml)}ml. `;
  return pre+`${num(l.ml)}ml × ${l.freq} kali × ${l.days} hari = ${num(l.total)}ml → ${l.qty} botol ${m.vol}ml`;
}

/* ================= MUSIC (original 8-bit loops) ================= */
let musicOn=true;
const MUS={out:null,nbuf:null,step:0,next:0};
const mtof=m=>440*Math.pow(2,(m-69)/12);
/* calm: C major, 8 bars of 8 steps */
const CALM={dur:.23,roots:[48,45,41,43,48,45,41,43],q:[4,3,4,4,4,3,4,4],mel:[
  72,0,76,79, 76,0,74,72,   69,0,72,76, 74,72,69,0,
  65,69,72,77, 76,74,72,0,  71,0,74,79, 77,76,74,71,
  72,0,76,79, 84,0,79,76,   81,0,79,76, 72,0,69,0,
  77,0,76,77, 81,79,77,72,  74,0,71,74, 79,0,0,0]};
/* tense: A minor, faster, driving bass and drums */
const TENSE={dur:.165,roots:[45,41,43,40],q:[3,4,4,4],mel:[
  81,79,76,79, 81,0,84,83,  81,77,72,77, 81,0,79,77,
  79,74,71,74, 79,0,83,81,  80,76,71,76, 80,83,88,0]};
function ensureAudio(){
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    if(!MUS.out){MUS.out=actx.createGain();MUS.out.gain.value=.7;MUS.out.connect(actx.destination);
      const n=actx.sampleRate*.5|0;MUS.nbuf=actx.createBuffer(1,n,actx.sampleRate);const d=MUS.nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
    return true;
  }catch(e){return false}
}
function mnote(t,m,d,type,v){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(mtof(m),t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS.out);o.start(t);o.stop(t+d+.02)}
function mnoise(t,d,v,hp){const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=MUS.nbuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MUS.out);s.start(t);s.stop(t+d+.02)}
function mkick(t,v){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(MUS.out);o.start(t);o.stop(t+.16)}
function playStep(st,t,tense){
  const SG=tense?TENSE:CALM,i=st%SG.mel.length,bar=i>>3,b=i&7,d=SG.dur,root=SG.roots[bar],ch=[root+12,root+12+SG.q[bar],root+19];
  const m=SG.mel[i];if(m)mnote(t,m,d*.9,'square',tense?.05:.042);
  if(tense){
    mnote(t,b&1?root+12:root,d*.85,'triangle',.16);
    mnote(t,ch[b%3]+12,d*.4,'square',.016);
    if(b%4===0)mkick(t,.32);if(b%4===2)mnoise(t,.12,.12,1500);
    mnoise(t,.03,.04,7000);mnoise(t+d/2,.03,.03,7000);
  }else{
    if(!(b&1))mnote(t,b===4?root+7:root,d*1.8,'triangle',.14);
    if(b&1)mnote(t,ch[(b>>1)%3]+12,d*.5,'square',.016);
    if(b===0||b===4)mkick(t,.18);if(b&1)mnoise(t,.025,.025,8000);
  }
}
function musicTick(){
  if(!actx||!MUS.out||!musicOn||!S||S.over||S.menu)return;
  if(MUS.next<actx.currentTime)MUS.next=actx.currentTime+.05;
  const tense=!!S.tense;
  while(MUS.next<actx.currentTime+.15){playStep(MUS.step,MUS.next,tense);MUS.next+=(tense?TENSE:CALM).dur;MUS.step++}
}
function startMusic(){if(ensureAudio()){MUS.step=0;MUS.next=actx.currentTime+.1}}
setInterval(musicTick,25);

function newGame(mode){

function moodFor(p){const f=p.patience/p.max,[a,b,c]=p.th;return f>a?'smile':f>(a+b)/2?'neutral':f>b?'tired':f>(b+c)/2?'worried':f>c?'impatient':'angry'}
function loop(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(S&&!S.paused&&!S.over){
    S.time+=dt;
    S.slots.forEach((p,i)=>{
      if(p&&p.state==='wait'){
        p.patience-=dt;
        const mood=moodFor(p);
        if(mood!==p.mood){p.mood=mood;drawPatient(i);renderSay(i)}
        const f=Math.max(0,p.patience/p.max),pb=$('#pb'+i);
        if(pb){pb.firstChild.style.height=(f*100)+'%';pb.className='pbar'+(f<.25?' crit':f<.5?' warn':'')}
        const hb=$('#hb'+i);if(hb){hb.querySelector('i').style.width=(f*100)+'%';hb.className='hbar'+(f<.25?' crit':f<.5?' warn':'')}
        if(p.patience<=0)timeout(i);
      }else if(!p&&S.time<SHIFT_SEC-8){S.spawn[i]-=dt;if(S.spawn[i]<=0)spawn(i)}
    });
    const tense=S.slots.some(p=>p&&p.state==='wait'&&(p.mood==='angry'||p.mood==='impatient'));
    if(tense!==S.tense){S.tense=tense;MUS.step=0;if(actx)MUS.next=actx.currentTime+.05;$('#danger').classList.toggle('on',tense);S.slots.forEach((p,j)=>{if(p&&p.state==='wait')drawPatient(j)})}
    updateHud();
    if(S.time>=SHIFT_SEC){S.time=SHIFT_SEC;endGame('time')}
  }
  raf=requestAnimationFrame(loop);
}
function spawn(i){
  const M=MODES[S.mode],p=makePatient(S.mode);
  /* each patient brings a different amount of patience */
  p.max=Math.round(M.patience*rf(.6,1.4))+(p.lines.length-1)*6;p.patience=p.max;
  /* random mood thresholds: some skip sadness and go straight to angry, some turn neutral early */
  const t0=rf(.55,.85),t1=rf(.3,Math.min(.55,t0-.1)),t2=rf(.1,Math.min(.28,t1-.05));
  const r=Math.random();
  p.th=r<.25?[t0,t2,t2]:r<.45?[rf(.78,.93),t1,t2]:[t0,t1,t2];
  p.state='wait';p.mood='smile';p.basket=new Map();p.talks=0;p.line=null;
  S.slots[i]=p;sfx.ding();renderSlot(i);
  if(S.active==null||!S.slots[S.active])setActive(i);

function submit(i){
  const p=S.slots[i];if(!p||p.state!=='wait'||S.paused)return;
  const res=p.lines.map(l=>{const g=p.basket.get(l.id)||0;return{l,given:g,drugOk:g>0,qtyOk:g===l.qty}});
  const extras=[...p.basket.keys()].filter(id=>!p.lines.some(l=>l.id===id));
  let pts=0,errors=0;
  res.forEach(r=>{if(r.drugOk)pts+=10;if(r.qtyOk)pts+=10;else errors++});
  pts-=extras.length*10;errors+=extras.length;
  const perfect=errors===0;
  if(perfect){pts+=20+Math.round(p.patience/p.max*20);S.kecoh=Math.max(0,S.kecoh-8);S.correct++}
  else{S.kecoh=Math.min(100,S.kecoh+10*errors);S.mistakes.push({p,res,extras})}
  pts=Math.max(0,pts);S.score+=pts;S.served++;
  updateHud();
  if(perfect){p.mood='smile';drawPatient(i);sfx.ok();floatText(i,'+'+pts);sparkle(i);leave(i,true);return}
  p.mood='worried';drawPatient(i);sfx.bad();flashRed();floatText(i,'+'+pts,'bad');leave(i,false);
  showFeedback(p,res,extras,pts);
}

  const M=MODES[S.mode];
  clearLayer();
  [0,1].forEach(i=>{if(S.slots[i]&&S.slots[i].state==='wait')leave(i,true)});
  let stars=0;if(S.correct>=1)stars=1;if(S.correct>=Math.ceil(M.target*.66))stars=2;if(S.correct>=M.target)stars=3;
  const best=store.get('kd_best_px',{}),prev=best[S.mode],isBest=prev==null||S.score>prev;
  if(isBest){best[S.mode]=S.score;store.set('kd_best_px',best)}
  sfx.end();
  const title={time:'Syif tamat!',kecoh:'Kaunter kecoh!'}[reason];
  const sub=reason==='kecoh'?'Terlalu ramai pesakit tidak berpuas hati. Cuba lebih teliti dan pujuk pesakit.':stars===3?'Hebat! Sasaran syif tercapai.':'Syif 3 minit selesai. Cuba capai sasaran '+M.target+' pesakit tepat.';
  const rev=S.mistakes.slice(-3).reverse();
  const ov=document.createElement('div');ov.className='ov abs';
  ov.innerHTML=`<div class="panel pb end" role="dialog" aria-modal="true" aria-label="Keputusan"><div class="ribbon ${reason==='kecoh'?'red':'green'}">${title}</div>
    <div class="stars">${[1,2,3].map(i=>img(i<=stars?UI.star:UI.starOff)).join('')}</div>
    <p class="sub">${sub}</p>
    <div class="estats"><div><span>Markah</span><b>${S.score}</b></div><div><span>${isBest?'Rekod baharu':'Terbaik'}</span><b>${isBest?S.score:prev}</b></div><div><span>Tepat</span><b>${S.correct}/${M.target}</b></div><div><span>Dipujuk</span><b>${S.comforted}</b></div></div>
    ${rev.length?`<div class="review"><h4>Semak kesilapan</h4><ul class="res">${rev.map(x=>x.timeout
      ?`<li class="no">${icon(x.p.lines[0].id)}<div><div class="n">${x.p.name} pergi kerana menunggu terlalu lama</div><div class="c">${x.p.lines.map(l=>drugText(l,'mudah')+': '+l.qty+' '+UNIT(l.id)).join(' · ')}</div></div></li>`
      :x.res.filter(r=>!r.qtyOk).map(r=>`<li class="no">${icon(r.l.id)}<div><div class="n">${drugText(r.l,'mudah')} untuk ${x.p.name.split(' ')[0]}</div><div class="c">${calcText(r.l,S.mode)}</div></div></li>`).join('')+x.extras.map(id=>`<li class="no">${icon(id)}<div><div class="n">${MEDS[id].name} ${FORM[MEDS[id].form]} untuk ${x.p.name.split(' ')[0]}</div><div class="c">Ubat ini tiada dalam preskripsi.</div></div></li>`).join('')).join('')}</ul></div>`:''}
    <div class="prow"><button class="pbtn" id="emenu">Menu</button><button class="pbtn o" id="eagain">Main lagi</button></div><div class="endcredit"><b>Dicipta oleh ${CREDIT.name}, ${CREDIT.reg}</b><br>${CREDIT.role}, ${CREDIT.place}<br>Untuk sebarang kolaborasi, hubungi <b>${CREDIT.email}</b></div></div>`;
  const mode=S.mode;
  setTimeout(()=>{$('#layer').appendChild(ov);$('#eagain').onclick=()=>newGame(mode);$('#emenu').onclick=renderStart;$('#eagain').focus()},700);
}

buildStatic();fit();renderStart();
</script>
